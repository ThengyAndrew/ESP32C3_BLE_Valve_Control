<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ESP32-C3 Valve Web BLE</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Arial, "Microsoft YaHei", sans-serif;
      background: #f5f7fa;
      color: #1f2937;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
    }

    main {
      width: min(420px, calc(100vw - 32px));
      padding: 28px;
      background: #ffffff;
      border: 1px solid #d6dde6;
      border-radius: 8px;
      box-shadow: 0 10px 28px rgba(31, 41, 55, 0.08);
    }

    h1 {
      margin: 0 0 20px;
      font-size: 22px;
      font-weight: 700;
    }

    .row {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      margin: 12px 0;
      font-size: 15px;
    }

    .value {
      font-weight: 700;
    }

    .actions {
      display: grid;
      gap: 10px;
      margin-top: 24px;
    }

    button {
      min-height: 44px;
      border: 0;
      border-radius: 6px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.55;
    }

    #connectButton {
      background: #1d4ed8;
      color: #ffffff;
    }

    #toggleButton {
      background: #15803d;
      color: #ffffff;
    }

    #disconnectButton {
      background: #e5e7eb;
      color: #1f2937;
    }

    #log {
      min-height: 40px;
      margin-top: 18px;
      padding: 10px 12px;
      border-radius: 6px;
      background: #eef2f7;
      font-size: 13px;
      line-height: 1.4;
      word-break: break-word;
    }
  </style>
</head>
<body>
  <main>
    <h1>ESP32-C3 Valve Control</h1>

    <div class="row">
      <span>BLE device</span>
      <span class="value">ESP32C3_VALVE_CTRL</span>
    </div>
    <div class="row">
      <span>Connection</span>
      <span id="connectionState" class="value">Disconnected</span>
    </div>
    <div class="row">
      <span>GPIO10</span>
      <span id="gpioState" class="value">--</span>
    </div>

    <div class="actions">
      <button id="connectButton" type="button">Connect</button>
      <button id="toggleButton" type="button" disabled>Toggle GPIO10</button>
      <button id="disconnectButton" type="button" disabled>Disconnect</button>
    </div>

    <div id="log">Ready.</div>
  </main>

  <script>
    const DEVICE_NAME = "ESP32C3_VALVE_CTRL";
    const SERVICE_UUID = "7b7d0001-2f4a-4f3d-9b4a-6a9d7f3c1000";
    const COMMAND_CHAR_UUID = "7b7d0002-2f4a-4f3d-9b4a-6a9d7f3c1000";
    const STATE_CHAR_UUID = "7b7d0003-2f4a-4f3d-9b4a-6a9d7f3c1000";

    let bleDevice = null;
    let gattServer = null;
    let commandCharacteristic = null;
    let stateCharacteristic = null;

    const connectButton = document.getElementById("connectButton");
    const toggleButton = document.getElementById("toggleButton");
    const disconnectButton = document.getElementById("disconnectButton");
    const connectionState = document.getElementById("connectionState");
    const gpioState = document.getElementById("gpioState");
    const logBox = document.getElementById("log");
    const textEncoder = new TextEncoder();
    const textDecoder = new TextDecoder("utf-8");

    function log(message) {
      logBox.textContent = message;
    }

    function setConnectedUi(connected) {
      connectionState.textContent = connected ? "Connected" : "Disconnected";
      connectButton.disabled = connected;
      toggleButton.disabled = !connected;
      disconnectButton.disabled = !connected;
      if (!connected) {
        gpioState.textContent = "--";
      }
    }

    async function readState() {
      const value = await stateCharacteristic.readValue();
      const state = textDecoder.decode(value);
      gpioState.textContent = state;
      return state;
    }

    async function connect() {
      if (!navigator.bluetooth) {
        throw new Error("This browser does not support Web Bluetooth.");
      }

      log("Requesting Bluetooth device...");
      bleDevice = await navigator.bluetooth.requestDevice({
        filters: [{ name: DEVICE_NAME }],
        optionalServices: [SERVICE_UUID],
      });
      bleDevice.addEventListener("gattserverdisconnected", onDisconnected);

      log("Connecting...");
      gattServer = await bleDevice.gatt.connect();
      const service = await gattServer.getPrimaryService(SERVICE_UUID);
      commandCharacteristic = await service.getCharacteristic(COMMAND_CHAR_UUID);
      stateCharacteristic = await service.getCharacteristic(STATE_CHAR_UUID);

      setConnectedUi(true);
      const state = await readState();
      log(`Connected. GPIO10 is ${state}.`);
    }

    async function toggleGpio() {
      toggleButton.disabled = true;
      try {
        await commandCharacteristic.writeValueWithResponse(textEncoder.encode("TOGGLE"));
        const state = await readState();
        log(`GPIO10 toggled to ${state}.`);
      } finally {
        toggleButton.disabled = false;
      }
    }

    function disconnect() {
      if (bleDevice && bleDevice.gatt.connected) {
        bleDevice.gatt.disconnect();
      } else {
        onDisconnected();
      }
    }

    function onDisconnected() {
      gattServer = null;
      commandCharacteristic = null;
      stateCharacteristic = null;
      setConnectedUi(false);
      log("Disconnected.");
    }

    connectButton.addEventListener("click", async () => {
      try {
        connectButton.disabled = true;
        await connect();
      } catch (error) {
        setConnectedUi(false);
        log(error.message);
      }
    });

    toggleButton.addEventListener("click", async () => {
      try {
        await toggleGpio();
      } catch (error) {
        log(error.message);
      }
    });

    disconnectButton.addEventListener("click", disconnect);
  </script>
</body>
</html>
